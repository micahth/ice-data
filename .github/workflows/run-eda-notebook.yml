name: Run EDA Notebook

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/01_eda.ipynb'
      - 'notebooks/requirements.txt'
      - '.github/workflows/run-eda-notebook.yml'
  workflow_dispatch:   # adds "Run workflow" button in the Actions tab

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true        # pulls all Git LFS files automatically

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: notebooks/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r notebooks/requirements.txt
          pip install jupyter nbconvert

      - name: Create figures output directory
        run: mkdir -p notebooks/figures

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=3600 \
            --inplace \
            notebooks/01_eda.ipynb
        env:
          MPLBACKEND: Agg   # headless matplotlib (no display needed)

      - name: Convert to HTML for easy viewing
        run: |
          jupyter nbconvert \
            --to html \
            notebooks/01_eda.ipynb \
            --output notebooks/01_eda_executed.html

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: eda-results
          path: |
            notebooks/01_eda.ipynb
            notebooks/01_eda_executed.html
            notebooks/figures/
          retention-days: 30
