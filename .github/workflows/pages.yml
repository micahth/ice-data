name: Publish dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'bi/**'
      - 'notebooks/results/**'
      - 'notebooks/figures/**'
      - 'notebooks/geo_common.py'
      - 'outputs/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python dashboard/build_site.py --output site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
