name: Test analysis

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - 'dashboard/**'
      - '.streamlit/**'
      - 'bi/**'
      - 'sql/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'notebooks/**'
      - 'dashboard/**'
      - '.streamlit/**'
      - 'bi/**'
      - 'sql/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
      - '.gitattributes'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r dashboard/requirements.txt

      - name: Test helpers, synthetic data and result contracts
        run: python -m pytest -q
        env:
          MPLBACKEND: Agg

      - name: Check script syntax
        run: python -m compileall -q notebooks dashboard bi tests

      - name: Build standalone dashboard and Tableau package
        run: python dashboard/build_site.py --output site

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: site
